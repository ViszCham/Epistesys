name: Research aggregate and documentation checks

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - benchmarks/gb-cc75/**
      - scripts/research/**
      - .gitattributes
      - .github/workflows/research-artifacts.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - benchmarks/gb-cc75/**
      - scripts/research/**
      - .gitattributes
      - .github/workflows/research-artifacts.yml

permissions:
  contents: read

jobs:
  aggregate-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -B scripts/research/verify-gb-cc75.py
      - run: python3 -B scripts/research/test-gb-cc75.py
      - run: python3 -B scripts/research/verify-research-docs.py
