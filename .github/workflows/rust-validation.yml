name: Rust implementation and boundary regression

on:
  pull_request:
    paths:
      - 'scripts/lc631/**'
      - 'scripts/research/**'
      - 'scripts/run-lc631.ps1'
      - 'scripts/run-epistesys.ps1'
      - 'scripts/media_backend.py'
      - 'scripts/*source-package*'
      - 'scripts/test-lc631-host-stop-hook.*'
      - 'hooks/**'
      - '.codex-plugin/**'
      - 'fixtures/**'
      - 'schemas/**'
      - '.github/workflows/rust-validation.yml'
  push:
    branches: [main, 'codex/epr-*']
    paths:
      - 'scripts/lc631/**'
      - 'scripts/research/**'
      - 'scripts/run-lc631.ps1'
      - 'scripts/run-epistesys.ps1'
      - 'scripts/media_backend.py'
      - 'scripts/*source-package*'
      - 'scripts/test-lc631-host-stop-hook.*'
      - 'hooks/**'
      - '.codex-plugin/**'
      - 'fixtures/**'
      - 'schemas/**'
      - '.github/workflows/rust-validation.yml'

permissions:
  contents: read

concurrency:
  group: rust-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Keep assertions/overflow checks and optimization levels unchanged.
      # Avoid retaining two profiles of hundreds of debug-heavy test binaries.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: scripts/lc631
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: python -B ../research/rust_format.py
      - name: Format driver failure and coverage controls
        run: python -B ../research/test_rust_format.py
      - name: Rust failure-propagation control
        run: cargo +1.98.0 test -p lc631-cli --no-default-features --test epr_ci_control --locked
      - name: Journal bundle schema regression
        shell: pwsh
        run: pwsh -NoProfile -File ../research/Test-Tlcx07BundleSchema.ps1
      - name: No implicit build cache in launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File ../research/Test-TlcxCachePrevention.ps1
      - name: Check
        run: cargo +1.98.0 check --workspace --locked
      - name: Strict clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Portable tests
        run: cargo +1.98.0 test --workspace --no-default-features --locked --no-fail-fast
      - name: Default feature tests
        run: cargo +1.98.0 test --workspace --locked --no-fail-fast
      - name: Release build
        run: cargo +1.98.0 build --workspace --release --locked
      - name: Packaged Windows hook byte transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = (Resolve-Path ../..).Path
          $binary = Join-Path (Get-Location) 'target/release/lc631.exe'
          $directory = Join-Path $plugin 'scripts/lc631/bin/windows-x86_64'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $directory 'lc631.exe')
          $digest = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          & (Join-Path $plugin 'scripts/test-lc631-host-stop-hook.ps1') -PluginRoot $plugin -TransportOnly -ExpectedReceiverSha256 $digest
          if ($LASTEXITCODE -ne 0) { throw 'Packaged hook byte transport failed' }
      - name: Python worker locks
        run: python -B workers/test_dgcl_nlp_worker.py
      - name: Media wire regression
        run: python -B workers/test_media_backend.py
      - name: Pinned byte regression
        run: python -B workers/test_pinned_bytes.py
      - name: Report runner disk budget
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
