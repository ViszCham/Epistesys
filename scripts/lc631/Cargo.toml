[workspace]
members = [
    "crates/lc631-substrate",
    "crates/lc631-solvers",
    "crates/lc631-runtime",
    "crates/lc631-receipt-kernel",
    "crates/lc631-core",
    "crates/lc631-analysis",
    "crates/lc631-tl",
    "crates/lc631-tldg",
    "crates/lc631-world",
    "crates/lc631-accelerator",
    "crates/lc631-media",
    "crates/lc631-host",
    "crates/lc631-compat",
    "crates/lc631-wire",
    "crates/lc631-cli",
    "crates/lc631-process-supervisor",
]
resolver = "2"

[workspace.package]
version = "7.0.0-beta.1"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
getrandom = "0.3"
cubecl-core = { version = "=0.10.0", default-features = false, features = ["std"] }
cubecl-wgpu = { version = "=0.10.0", default-features = false, features = ["std"] }
wgpu = { version = "=29.0.4", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false }
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"

# Keep exact executable/source hashing affordable in bounded debug validation.
# This changes code generation, not the algorithm, freshness checks or budgets.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

# Exact rational enclosure tests are CPU-intensive in unoptimized dependencies.
# Keep debug/overflow checks enabled and optimize only the numeric substrate
# and its arithmetic dependencies; this does not relax measurement budgets.
[profile.dev.package.lc631-substrate]
opt-level = 1

[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.num-integer]
opt-level = 1

[profile.dev.package.num-rational]
opt-level = 1
